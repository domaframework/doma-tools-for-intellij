[versions]
# libraries
junit = "4.13.2"
doma = "3.2.0"
logback = "1.6.3"
pluginVerifier = "1.409"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.18.1"
kotlin = "2.4.10"
kover = "0.9.9"
qodana = "2026.2.0"
grammarkit = "2023.3.0.4"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version = "2.0.18" }
kotlinTest = { group = "org.jetbrains.kotlin", name = "kotlin-test" }
domacore = { module = "org.seasar.doma:doma-core", version.ref = "doma" }
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version = "1.28.0" }
ktlint = { module = "com.pinterest.ktlint:ktlint-cli", version = "1.8.0" }
jackson = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version = "2.22.1" }
pluginVerifier = { group = "org.jetbrains.intellij.plugins", name = "verifier-cli", version.ref = "pluginVerifier" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
grammarkit= { id = "org.jetbrains.grammarkit", version.ref = "grammarkit" }
spotless = { id = "com.diffplug.spotless", version = "8.8.0" }
